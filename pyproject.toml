[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verity"
version = "0.1.0"
description = "A cognitive memory system for AI agents — neuroscience-inspired, zero dependencies by default"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Claude", email = "noreply@anthropic.com"},
]

keywords = [
    "memory",
    "ai-agents",
    "cognitive",
    "llm",
    "rag",
    "knowledge-graph",
    "sqlite",
    "embeddings",
    "neuroscience",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies — no optional extras required to run
dependencies = [
    "rdflib>=7.0.0",           # RDF core — BSD-3-Clause, 20yr pedigree
    "pySHACL>=0.26.0",         # SHACL validation — Apache-2.0
    "owlrl>=6.0.2",            # OWL-RL inference — BSD-3-Clause, no Java
    "fastapi>=0.115.0",        # API layer — MIT
    "fastmcp>=2.0.0",          # MCP interface — MIT
    "pydantic>=2.0.0",         # Settings + validation — MIT
    "uvicorn[standard]>=0.30.0", # ASGI server — BSD-3-Clause
    "yake>=0.4.8",             # Keyword extraction fallback — MIT
    "cryptography>=42.0.0",    # Ed25519 signing — Apache-2.0/BSD
    "httpx>=0.27.0",           # Async HTTP (Jena backend) — BSD-3-Clause
]

[project.optional-dependencies]
# Performance tier — Rust-backed SPARQL (37x speedup via oxrdflib bridge)
fast = [
    "pyoxigraph>=0.3.22",      # MIT/Apache-2.0, Rust-backed
    "oxrdflib>=0.5.0",         # oxrdflib rdflib store bridge
]

# Connector tier — dlt (data load tool) for 60+ data sources
connectors = [
    "dlt>=1.4.0",              # MIT, 60+ verified data sources
]

# Cognitive tier — optional ML backends for semantic search
cognitive = [
    "model2vec>=0.3.0",
    "hnswlib>=0.8.0",
]

# Full tier — all optional features combined
full = [
    "pyoxigraph>=0.3.22",
    "oxrdflib>=0.5.0",
    "dlt>=1.4.0",
    "model2vec>=0.3.0",
    "hnswlib>=0.8.0",
]

# Team tier — PostgreSQL backend
team = [
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pgvector>=0.3.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "hatch>=1.12.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
verity = "verity.cli:main"

[project.urls]
Homepage = "https://github.com/bnyhil31-afk/verity"
Repository = "https://github.com/bnyhil31-afk/verity"
"Bug Tracker" = "https://github.com/bnyhil31-afk/verity/issues"
Changelog = "https://github.com/bnyhil31-afk/verity/blob/main/CHANGELOG.md"

# ── Hatch build configuration ────────────────────────────────────────────────
# Force metadata version 2.3 — packaging 24.0 (system) does not support 2.4
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that take more than a few seconds",
    "integration: tests requiring live external services (skipped in CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["verity"]
omit = ["tests/*", "*/migrations/*"]
