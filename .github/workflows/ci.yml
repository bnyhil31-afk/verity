name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check verity/ tests/

      - name: Type check (mypy)
        run: mypy verity/
        continue-on-error: true  # Informational until type coverage is complete

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=verity --cov-report=term-missing

      - name: Verify crisis barrier (canary smoke test)
        run: |
          python -c "
          from verity.core.crisis import is_crisis_input
          assert is_crisis_input('I want to end my life'), 'CANARY FAILED: crisis barrier not firing'
          assert not is_crisis_input('Schedule a follow-up'), 'CANARY FAILED: false positive'
          print('Crisis barrier canary: PASS')
          "
