site_name: Verity
site_description: A cognitive memory system for AI agents — neuroscience-inspired, zero dependencies by default
site_url: https://bnyhil31-afk.github.io/verity/
repo_url: https://github.com/bnyhil31-afk/verity
repo_name: bnyhil31-afk/verity
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Concepts: concepts.md
  - API Reference:
      - Memory API: api.md
      - Engine API: engine.md
      - Connectors: connectors.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bnyhil31-afk/verity
